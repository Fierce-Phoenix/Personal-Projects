{% extends "layout.html" %}

{% block title %}
Compare vehicles
{% endblock %}

{% block main %}
<div class = "table-responsive">
<table class = "table table-hover table-bordered align-middle eco-table">
    <thead class="table-success">
        <tr>
            <th>
                Make
            </th>
            <th>
                Model
            </th>
            <th>
                Year
            </th>
            <th>
                Combined MPG
            </th>
            <th>
                CO2 GPM
            </th>
            <th>
                More info
            </th>
            <th>
                Remove
            </th>
            <th>
                Compare
            </th>
        </tr>
    </thead>
    <tbody>
        {% for car in cars %}
        <tr>
            <td>
                {{car.make}}
            </td>
            <td>
                {{car.model}}
            </td>
            <td>
                {{car.year}}
            </td>
            <td>
                {{car.combined_mpg}}
            </td>
            <td>
                {{car.co2_gpm}}
            </td>
            <td>
                <form action = "/search/submit">
                    <input type="hidden" name="car_id" value="{{ car.car_id or '' }}">
                    <button type = "submit" class="btn btn-outline-primary btn-sm">More info</button>
                </form>
            </td>
            <td>
                <form action = "/shortlisted_vehicles/remove", method = "post">
                    <input type="hidden" name="car_id" value="{{ car.car_id or '' }}">
                    <button type = "submit" class="btn btn-outline-danger btn-sm">Remove</button>
                </form>
            </td>
            <td>
                <form action = "/compare", method = "post">
                    <input type="hidden" name="car_id" value="{{ car.car_id or '' }}">
                    <button type = "submit" class="btn btn-success btn-sm">Compare</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
