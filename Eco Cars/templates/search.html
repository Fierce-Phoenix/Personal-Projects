{% extends "layout.html" %}

{% block title %}
Search
{% endblock %}

{% block main %}

<div class="search-row">

    <form action="/search/makes">
        <select name="make" onchange="this.form.submit()" class="form-select d-inline-block w-auto mx-1">
            <option value="">Make</option>
            {% for make in makes %}
                <option value="{{ make.make }}" {% if make.make == selected_make %}selected{% endif %}>
                    {{ make.make }}
                </option>
            {% endfor %}
        </select>
    </form>

    <form action="/search/models">
        <input type="hidden" name="make" value="{{ selected_make or '' }}">
        <select name="model" onchange="this.form.submit()" {% if not selected_make %}disabled{% endif %} class="form-select d-inline-block w-auto mx-1">
            <option value="">Model</option>
            {% for model in models %}
                <option value="{{ model.model }}" {% if model.model == selected_model %}selected{% endif %}>
                    {{ model.model }}
                </option>
            {% endfor %}
        </select>
    </form>

    <form action="/search/submit">
        <input type="hidden" name="make" value="{{ selected_make or '' }}">
        <input type="hidden" name="model" value="{{ selected_model or '' }}">
        <select name="year" {% if not selected_model %}disabled{% endif %} class="form-select d-inline-block w-auto mx-1">
            <option value="">Year</option>
            {% for year in years %}
                <option value="{{ year.year }}" {% if year.year == selected_year %}selected{% endif %}>
                    {{ year.year }}
                </option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary mx-1">Search</button>
    </form>

</div>

{% endblock %}
